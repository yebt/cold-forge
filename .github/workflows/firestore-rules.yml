name: Firestore rules

# Reusable: the Firestore rules + emulator suite. Called by ci.yml (every push/PR) and by
# firebase-deploy.yml (gate before a production deploy). Security rules are the only thing
# protecting user data, so they are always tested against the emulator.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Rules + emulator tests
        run: >-
          bunx firebase-tools@15.32.1 emulators:exec --only auth,firestore --project demo-coldforge
          "bun test firebase/rules.test.ts apps/app/src/firebase/emulator.test.ts"
