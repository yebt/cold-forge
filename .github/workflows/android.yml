name: Android APK

# Builds the Capacitor Android app and publishes `cold-forge.apk` (+ `.sha256`).
# - Tag `v1.2.3` → signed release APK attached to the GitHub Release for that tag
#   (the landing links to releases/latest/download/cold-forge.apk).
# - Manual run → APK as a workflow artifact only.
# Signing secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD. Without them it builds a debug APK and says so loudly (see docs/deploy.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # create/update the GitHub Release on tags
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install
        run: bun install --frozen-lockfile

      # apps/app/.env.production (committed) holds the public Firebase web config and URLs.
      # Repository variables, when set, override it through .env.production.local.
      - name: Production env overrides
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FUNCTIONS_REGION: ${{ vars.VITE_FUNCTIONS_REGION }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: |
          out=apps/app/.env.production.local
          : > "$out"
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID \
            VITE_FUNCTIONS_REGION VITE_APP_URL VITE_SITE_URL; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s=%s\n' "$name" "$value" >> "$out"; fi
          done
          echo "Overrides: $(cut -d= -f1 "$out" | tr '\n' ' ')"

      - name: Build web bundle
        run: bun run --filter @cold-forge/app build

      - name: Native project
        working-directory: apps/app
        run: |
          if [ ! -d android ]; then
            echo "::warning::apps/app/android is missing; generating it from the Capacitor template (commit it instead)."
            bunx cap add android
          fi
          bunx cap sync android

      # Native Google sign-in needs the Android app's google-services.json (Firebase console).
      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > apps/app/android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set: native Google sign-in will not work in this APK (guest mode still does)."
          fi

      - name: Version from tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ] && [[ "$REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            name="${REF_NAME#v}"
            code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          else
            name="0.0.0-dev.${RUN_NUMBER}+${SHA::7}"
            code="$RUN_NUMBER"
          fi
          echo "ANDROID_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "versionName=$name versionCode=$code"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew --no-daemon assembleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/cold-forge.apk"

      - name: Build debug APK (no signing secrets)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: apps/app/android
        run: |
          echo "::warning title=Unsigned build::ANDROID_KEYSTORE_BASE64 is not set, so this is a DEBUG APK signed with a throwaway key. Users cannot update it in place with a later signed release. See docs/deploy.md."
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/cold-forge.apk"

      - name: Checksum
        working-directory: ${{ runner.temp }}
        run: |
          sha256sum cold-forge.apk > cold-forge.apk.sha256
          cat cold-forge.apk.sha256
          mkdir -p "$GITHUB_WORKSPACE/out"
          mv cold-forge.apk cold-forge.apk.sha256 "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cold-forge-apk
          path: |
            out/cold-forge.apk
            out/cold-forge.apk.sha256
          if-no-files-found: error

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            out/cold-forge.apk
            out/cold-forge.apk.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          # A debug build must never become "latest" (the landing downloads releases/latest).
          prerelease: ${{ env.HAS_KEYSTORE != 'true' }}
          make_latest: ${{ env.HAS_KEYSTORE == 'true' }}
