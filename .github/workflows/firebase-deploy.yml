name: Firebase deploy

# Deploys the Firestore rules/indexes and the Cloud Functions to coldforge-work on every push to
# main that touches them. Auth is keyless: GitHub's OIDC token is exchanged through Workload
# Identity Federation for a short-lived token of the github-deploy service account (no JSON key
# anywhere). One-time setup: scripts/setup-github-deploy.sh in Cloud Shell, then the repository
# variables GCP_WIF_PROVIDER and GCP_DEPLOY_SA (docs/deploy.md). Until they exist the deploy job
# is skipped with a notice instead of failing.

on:
  push:
    branches: [main]
    paths:
      - "firebase/**"
      - "firebase.json"
      - ".firebaserc"
      - "apps/functions/**"
      # Bundled into the functions by apps/functions/build.ts.
      - "packages/sync/**"
      - "packages/core/**"
      - "bun.lock"
      - ".github/workflows/firebase-deploy.yml"
      - ".github/workflows/firestore-rules.yml"
  workflow_dispatch:

permissions: {}

# One deploy at a time, in push order; a running deploy is never cancelled halfway.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  rules-test:
    permissions:
      contents: read
    uses: ./.github/workflows/firestore-rules.yml

  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      configured: ${{ steps.vars.outputs.configured }}
    steps:
      - name: Check deploy variables
        id: vars
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          if [ -n "$GCP_WIF_PROVIDER" ] && [ -n "$GCP_DEPLOY_SA" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Firebase deploy skipped::Repository variables GCP_WIF_PROVIDER and GCP_DEPLOY_SA are not set yet. Run scripts/setup-github-deploy.sh in Google Cloud Shell and add them (docs/deploy.md)."
          fi

  deploy:
    needs: [rules-test, preflight]
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Add protection rules (required reviewers, branch policy) under Settings → Environments →
    # production whenever you want a manual gate; the job waits for them.
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # firebase-tools loads the functions source with Node to discover them: match the runtime (nodejs22).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install
        run: bun install --frozen-lockfile

      - name: Functions typecheck + unit tests
        run: |
          bun run --filter @cold-forge/functions typecheck
          bun run --filter @cold-forge/functions test

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # --force: non-interactive deletion of functions removed from the source (and keeps the
      # existing Artifact Registry cleanup policy). The predeploy hook in firebase.json builds the
      # functions bundle.
      - name: Deploy Firestore rules/indexes and Cloud Functions
        run: bunx firebase-tools@15.32.1 deploy --only firestore,functions --project coldforge-work --non-interactive --force
